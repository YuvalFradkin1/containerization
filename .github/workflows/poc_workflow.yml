name: PoC — Symlink Containment Bypass

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tests/ContainerizationArchiveTests/SymlinkContainmentBypassTests.swift'
      - '.github/workflows/poc_workflow.yml'

jobs:
  poc-swift-macos:
    name: "L2 — real ArchiveReader + LocalContent (macOS)"
    runs-on: macos-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build ContainerizationArchive + ContainerizationOCI
        run: |
          swift build \
            --target ContainerizationArchive \
            --target ContainerizationOCI \
            2>&1

      - name: Run PoC
        run: |
          swift build --target ContainerizationArchiveTests 2>&1
          swift test \
            --filter "SymlinkContainmentBypassTests/symlinkContainmentBypass" \
            --verbose \
            2>&1 | tee poc_output.txt

      - name: Assert PASS
        run: |
          grep "\[PASS\] SymlinkContainmentBypass" poc_output.txt && \
            echo "✅ L2 PASS" || { echo "❌ PASS not found"; exit 1; }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-output-macos
          path: poc_output.txt

  poc-libarchive-ubuntu:
    name: "L1 — real libarchive + symlinkat (Ubuntu)"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install libarchive
        run: sudo apt-get install -y libarchive13

      - name: Compile C PoC
        run: |
          gcc -I. -o poc_real poc_real.c \
            /usr/lib/x86_64-linux-gnu/libarchive.so.13 \
            -Wl,-rpath,/usr/lib/x86_64-linux-gnu

      - name: Run C PoC
        run: |
          python3 create_malicious_tar.py \
            --target /tmp/poc_outside_root/secret.txt \
            --output malicious_oci.tar
          mkdir /tmp/poc_extract
          ./poc_real malicious_oci.tar /tmp/poc_extract | tee poc_output.txt
          grep "\[PASS\]" poc_output.txt && echo "✅ L1 PASS" || { echo "❌ FAIL"; exit 1; }

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-output-ubuntu
          path: poc_output.txt
