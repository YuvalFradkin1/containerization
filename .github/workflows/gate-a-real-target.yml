name: Gate A — real ContainerizationEXT4 crash on macOS 26 ARM64

# Runs the PoC against the UNMODIFIED upstream apple/containerization
# on a macOS 26 Apple Silicon runner (matching production requirements).
# Evidence goal: IPS crash report showing computeHash() / char.asciiValue!
# fatal trap in the real ContainerizationEXT4 library code path.

on:
  push:
    branches: [poc-crash-test]
    paths-ignore:
      - 'crash-evidence/**'
      - 'crash-evidence-real/**'
  workflow_dispatch:

jobs:
  gate-a-real:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout fork (for PoC source and evidence commit)
        uses: actions/checkout@v4

      - name: Clone upstream apple/containerization (unmodified HEAD)
        run: |
          git clone --depth 1 https://github.com/apple/containerization /tmp/containerization
          echo "Upstream HEAD: $(git -C /tmp/containerization rev-parse HEAD)"

      - name: Copy PoC source into upstream clone
        run: |
          mkdir -p /tmp/containerization/Sources/PoCXattrCrash
          cp poc_real/Sources/poc_real/main.swift \
             /tmp/containerization/Sources/PoCXattrCrash/main.swift
          echo "[*] PoC source placed at Sources/PoCXattrCrash/main.swift"

      - name: Patch upstream Package.swift to add PoCXattrCrash target
        run: |
          python3 - <<'PYEOF'
          import re, sys

          path = "/tmp/containerization/Package.swift"
          with open(path) as f:
              src = f.read()

          # Target block to inject (before the closing bracket of targets list)
          poc_target = '''
          .executableTarget(
              name: "PoCXattrCrash",
              dependencies: [
                  "ContainerizationEXT4",
                  .product(name: "SystemPackage", package: "swift-system"),
              ],
              path: "Sources/PoCXattrCrash"
          ),'''

          # Insert just before the last '],' that closes the targets array.
          # Heuristic: find the closing of the targets: [ array
          # We look for the pattern '        ]\n    )' which ends targets in containerization Package.swift
          # Safer: inject before the first .testTarget or before the final closing ] of targets
          marker = '        .testTarget('
          if marker in src:
              src = src.replace(marker, poc_target + '\n' + marker, 1)
          else:
              print("WARN: marker not found, trying fallback")
              sys.exit(1)

          with open(path, 'w') as f:
              f.write(src)
          print("[*] Package.swift patched successfully")
          PYEOF

      - name: Show patched Package.swift excerpt
        run: grep -A 8 "PoCXattrCrash" /tmp/containerization/Package.swift

      - name: Build PoCXattrCrash against real library
        working-directory: /tmp/containerization
        run: |
          swift build --target PoCXattrCrash 2>&1
          BUILD_EXIT=$?
          echo "[*] Build exit: $BUILD_EXIT"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "[-] Build FAILED with exit $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          echo "[*] .build/debug/ contents:"
          ls -la .build/debug/ 2>/dev/null || echo "(missing)"
          echo "[*] All PoCXattrCrash entries under .build:"
          find .build -name "PoCXattrCrash" 2>/dev/null
          echo "[*] --show-bin-path:"
          swift build --target PoCXattrCrash --show-bin-path 2>&1
          echo "[*] Resolved pwd:"
          pwd -P

      - name: Record pre-run timestamp for IPS detection
        run: date -u +%s > /tmp/pre_run_ts && date -u

      - name: Run PoC — expect fatal trap
        working-directory: /tmp/containerization
        run: |
          set +e
          # Primary: swift run PoCXattrCrash (product name, no --target, valid in Swift 6)
          echo "[*] Attempting: swift run PoCXattrCrash"
          swift run PoCXattrCrash 2>&1
          EXIT=$?
          echo "[*] PoCXattrCrash exit code: $EXIT"
          # If swift run itself errored (not a crash), fall back to direct binary
          if [ "$EXIT" -eq 64 ] || [ "$EXIT" -eq 1 ]; then
            echo "[*] swift run failed ($EXIT), trying direct binary..."
            BIN=$(swift build --target PoCXattrCrash --show-bin-path 2>/dev/null)/PoCXattrCrash
            echo "[*] Direct binary path: $BIN"
            ls -la "$BIN" 2>/dev/null
            "$BIN" 2>&1
            EXIT=$?
            echo "[*] Direct binary exit code: $EXIT"
            echo "$BIN" > /tmp/poc_bin_path
          else
            echo "swift run PoCXattrCrash" > /tmp/poc_bin_path
          fi
          echo "$EXIT" > /tmp/poc_exit_code
          # non-zero expected (SIGTRAP=5, SIGABRT=6, or 132/134 from signal)
          set -e

      - name: Wait for CrashReporter to write IPS
        run: sleep 30

      - name: Collect IPS crash report
        run: |
          POC_EXIT=$(cat /tmp/poc_exit_code 2>/dev/null || echo "?")
          echo "[*] PoC exit code: $POC_EXIT"
          echo ""
          echo "=== All DiagnosticReport locations ==="
          ls -lrt ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(user dir empty or missing)"
          ls -lrt /Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(system dir empty or missing)"
          ls -lrt ~/Library/Logs/CrashReporter/ 2>/dev/null || echo "(CrashReporter dir missing)"
          echo ""
          PRE=$(cat /tmp/pre_run_ts)
          echo "[*] Searching all report dirs for PoCXattrCrash*.ips newer than $PRE..."
          for DIR in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/CrashReporter"; do
            find "$DIR" -name "PoCXattrCrash*.ips" 2>/dev/null | while read f; do
              MTIME=$(stat -f %m "$f")
              if [ "$MTIME" -ge "$PRE" ]; then
                echo "=== FOUND: $f ==="
                cat "$f"
              fi
            done
          done
          echo ""
          echo "=== Any crash log for PoCXattrCrash (all formats) ==="
          find "$HOME/Library/Logs" /Library/Logs /tmp -name "*PoCXattrCrash*" 2>/dev/null | while read f; do
            echo "FILE: $f"
            cat "$f" 2>/dev/null | head -100
          done

      - name: Stage crash evidence
        run: |
          mkdir -p crash-evidence-real
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          PRE=$(cat /tmp/pre_run_ts)
          POC_EXIT=$(cat /tmp/poc_exit_code 2>/dev/null || echo "?")

          # Copy any fresh IPS from all known locations
          for DIR in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/CrashReporter"; do
            find "$DIR" -name "PoCXattrCrash*.ips" 2>/dev/null | while read f; do
              MTIME=$(stat -f %m "$f")
              if [ "$MTIME" -ge "$PRE" ]; then
                cp "$f" "crash-evidence-real/PoCXattrCrash-${TS}.ips"
                echo "[+] IPS staged from $f"
              fi
            done
          done

          # Always capture run metadata
          echo "Run: $TS | upstream HEAD: $(git -C /tmp/containerization rev-parse HEAD)" \
            > crash-evidence-real/run-${TS}.txt
          echo "macOS: $(sw_vers -productVersion) | arch: $(uname -m)" \
            >> crash-evidence-real/run-${TS}.txt
          echo "Swift: $(/usr/bin/swift --version 2>&1 | head -1)" \
            >> crash-evidence-real/run-${TS}.txt
          echo "PoC exit code: $POC_EXIT" \
            >> crash-evidence-real/run-${TS}.txt
          echo "PoC binary: $(cat /tmp/poc_bin_path 2>/dev/null || echo unknown)" \
            >> crash-evidence-real/run-${TS}.txt
          ls -la crash-evidence-real/

      - name: Commit evidence
        run: |
          git config user.name  "gate-a-bot"
          git config user.email "gate-a-bot@noreply"
          git add crash-evidence-real/
          git diff --cached --stat
          git commit -m "ci: Gate A real-target evidence $(date -u +%Y%m%dT%H%M%SZ) [skip ci]" \
            || echo "nothing to commit"
          # Retry push up to 3 times with fetch+rebase to handle concurrent CI commits
          for i in 1 2 3; do
            git push origin poc-crash-test && break
            echo "[retry $i] push rejected, rebasing onto remote..."
            git fetch origin poc-crash-test
            git rebase FETCH_HEAD
          done
