name: SymlinkEscape PoC — SIG-NEW (CWE-61/CWE-22)

on:
  push:
    branches: [main]
    paths:
      - 'poc-real/**'
      - '.github/workflows/poc-symlink-escape.yml'
  workflow_dispatch:

jobs:
  poc:
    name: Run SymlinkEscapePoC on macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: poc-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install libarchive (required by CArchive)
        run: brew install libarchive xz bzip2

      - name: Symlink Homebrew libs into /usr/local/lib (ld default search path)
        run: |
          LIBARCHIVE_LIB=$(brew --prefix libarchive)/lib
          XZ_LIB=$(brew --prefix xz)/lib
          BZ2_LIB=$(brew --prefix bzip2)/lib
          sudo mkdir -p /usr/local/lib
          # Create symlinks for every dylib/a in each prefix so ld can find them
          for lib in "$LIBARCHIVE_LIB"/libarchive.*; do
            sudo ln -sf "$lib" /usr/local/lib/$(basename "$lib") 2>/dev/null || true
          done
          for lib in "$XZ_LIB"/liblzma.*; do
            sudo ln -sf "$lib" /usr/local/lib/$(basename "$lib") 2>/dev/null || true
          done
          for lib in "$BZ2_LIB"/libbz2.*; do
            sudo ln -sf "$lib" /usr/local/lib/$(basename "$lib") 2>/dev/null || true
          done
          echo "=== /usr/local/lib after symlinking ==="
          ls /usr/local/lib/ | grep -E "archive|lzma|bz2" || echo "(nothing)"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build SymlinkEscapePoC
        run: |
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          swift build -c release --product SymlinkEscapePoC \
            -Xcc -I${LIBARCHIVE_PREFIX}/include \
            2>&1 | tee /tmp/build.log; BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            # Emit error lines as GitHub annotations
            grep -E "error:" /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "## Swift build errors" >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
            grep -A 3 "error:" /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || cat /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $BUILD_EXIT

      - name: Run SymlinkEscapePoC — capture output
        id: poc
        run: |
          set +e
          OUTPUT=$(.build/release/SymlinkEscapePoC 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          echo "---"
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # Surface key lines for the summary
          echo "## SymlinkEscape PoC Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Fail the step only if the PoC itself reports failure
          echo "$OUTPUT" | grep -q "EXPLOIT CONFIRMED" && echo "✅ EXPLOIT CONFIRMED found in output" || echo "⚠️  EXPLOIT CONFIRMED not found"
