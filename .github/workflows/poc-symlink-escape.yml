name: SymlinkEscape PoC — SIG-NEW (CWE-61/CWE-22)

on:
  push:
    branches: [main]
    paths:
      - 'poc-real/**'
      - '.github/workflows/poc-symlink-escape.yml'
  workflow_dispatch:

jobs:
  poc:
    name: Run SymlinkEscapePoC on macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: poc-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install libarchive (required by CArchive)
        run: brew install libarchive xz bzip2

      - name: Resolve dependencies
        run: swift package resolve

      - name: Diagnose linker environment
        run: |
          echo "=== brew prefix libarchive ===" && brew --prefix libarchive
          echo "=== libarchive libs ===" && ls $(brew --prefix libarchive)/lib/ | grep archive || true
          echo "=== which clang ===" && which clang && clang --version
          echo "=== xcrun --show-sdk-path ===" && xcrun --show-sdk-path

      - name: Build SymlinkEscapePoC
        run: |
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          XZ_PREFIX=$(brew --prefix xz)
          BZ2_PREFIX=$(brew --prefix bzip2)
          swift build -c release --product SymlinkEscapePoC \
            -Xlinker -L${LIBARCHIVE_PREFIX}/lib \
            -Xlinker -L${XZ_PREFIX}/lib \
            -Xlinker -L${BZ2_PREFIX}/lib \
            -Xcc -I${LIBARCHIVE_PREFIX}/include \
            -v 2>&1 | grep -E "error:|warning:|ld |clang" | tee /tmp/build.log; BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            # Emit each error line as a GitHub annotation so it appears in the PR/run UI
            grep -E "error:|warning:" /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            # Also write all errors to the step summary
            echo "## Swift build errors" >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
            grep -A 3 "error:" /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || cat /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $BUILD_EXIT

      - name: Run SymlinkEscapePoC — capture output
        id: poc
        run: |
          set +e
          OUTPUT=$(.build/release/SymlinkEscapePoC 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          echo "---"
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # Surface key lines for the summary
          echo "## SymlinkEscape PoC Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Fail the step only if the PoC itself reports failure
          echo "$OUTPUT" | grep -q "EXPLOIT CONFIRMED" && echo "✅ EXPLOIT CONFIRMED found in output" || echo "⚠️  EXPLOIT CONFIRMED not found"
