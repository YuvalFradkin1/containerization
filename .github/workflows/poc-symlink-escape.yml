name: SymlinkEscape PoC — SIG-NEW (CWE-61/CWE-22)

on:
  push:
    branches: [main]
    paths:
      - 'poc-real/**'
      - '.github/workflows/poc-symlink-escape.yml'
  workflow_dispatch:

jobs:
  poc:
    name: Run SymlinkEscapePoC on macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: poc-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install and link libarchive, xz, bzip2
        run: |
          brew install libarchive xz bzip2
          # Force-link keg-only formulae so dylibs appear in /opt/homebrew/lib
          brew link --force libarchive xz bzip2
          echo "=== /opt/homebrew/lib after brew link ==="
          ls /opt/homebrew/lib/ | grep -E "archive|lzma|bz2" || echo "(nothing)"
          echo "=== brew --prefix libarchive ==="
          brew --prefix libarchive
          ls "$(brew --prefix libarchive)/lib/" | grep archive

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build SymlinkEscapePoC
        run: |
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          # Capture full output; emit errors as annotations; always show tail in summary
          set +e
          swift build -c release --product SymlinkEscapePoC \
            -Xcc -I${LIBARCHIVE_PREFIX}/include \
            -Xlinker -L${LIBARCHIVE_PREFIX}/lib \
            -Xlinker -L$(brew --prefix xz)/lib \
            -Xlinker -L$(brew --prefix bzip2)/lib \
            -Xlinker -L/opt/homebrew/lib \
            2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          # Annotate every error line
          grep -E "^.*error:" /tmp/build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          # Write tail of build log to summary
          echo "## Build log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -200 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $BUILD_EXIT

      - name: Run SymlinkEscapePoC — capture output
        id: poc
        run: |
          set +e
          OUTPUT=$(.build/release/SymlinkEscapePoC 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "## SymlinkEscape PoC Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" | grep -q "EXPLOIT CONFIRMED" && echo "✅ EXPLOIT CONFIRMED found in output" || echo "⚠️  EXPLOIT CONFIRMED not found"
