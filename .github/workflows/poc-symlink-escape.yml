name: SymlinkEscape PoC — SIG-NEW (CWE-61/CWE-22)

on:
  push:
    branches: [main]
    paths:
      - 'poc-real/**'
      - '.github/workflows/poc-symlink-escape.yml'
  workflow_dispatch:

jobs:
  poc:
    name: Run SymlinkEscapePoC on macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: poc-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install libarchive (required by CArchive)
        run: brew install libarchive xz bzip2

      - name: Link Homebrew libs into default ld search paths
        run: |
          sudo mkdir -p /usr/local/lib /usr/local/include
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          XZ_PREFIX=$(brew --prefix xz)
          BZ2_PREFIX=$(brew --prefix bzip2)
          echo "=== libarchive prefix: $LIBARCHIVE_PREFIX ==="
          ls "$LIBARCHIVE_PREFIX/lib/" | head -20
          echo "=== xz prefix: $XZ_PREFIX ==="
          ls "$XZ_PREFIX/lib/" | grep -E 'lzma|xz' | head -10
          echo "=== bz2 prefix: $BZ2_PREFIX ==="
          ls "$BZ2_PREFIX/lib/" | grep -E 'bz2' | head -10
          # Symlink each library file into /usr/local/lib
          for f in "$LIBARCHIVE_PREFIX/lib"/libarchive*; do
            sudo ln -sf "$f" /usr/local/lib/ 2>/dev/null || true; echo "  -> $f"
          done
          for f in "$XZ_PREFIX/lib"/liblzma* "$XZ_PREFIX/lib"/libxz*; do
            sudo ln -sf "$f" /usr/local/lib/ 2>/dev/null || true; echo "  -> $f"
          done
          for f in "$BZ2_PREFIX/lib"/libbz2*; do
            sudo ln -sf "$f" /usr/local/lib/ 2>/dev/null || true; echo "  -> $f"
          done
          echo "=== /usr/local/lib after linking ==="
          ls /usr/local/lib/ | grep -E "archive|lzma|bz2|xz" || echo "(nothing matched)"
          # Also symlink headers so CArchive can include libarchive headers
          for f in "$LIBARCHIVE_PREFIX/include"/archive*; do
            sudo ln -sf "$f" /usr/local/include/ 2>/dev/null || true
          done

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build SymlinkEscapePoC (full output to summary)
        run: |
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          set +e
          swift build -c release --product SymlinkEscapePoC \
            -Xcc -I${LIBARCHIVE_PREFIX}/include \
            2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "## Build exit code: $BUILD_EXIT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Write the last 150 lines (most likely to contain the error)
          tail -150 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ $BUILD_EXIT -ne 0 ]; then
            grep "error:" /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $BUILD_EXIT

      - name: Run SymlinkEscapePoC — capture output
        id: poc
        run: |
          set +e
          OUTPUT=$(.build/release/SymlinkEscapePoC 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          echo "---"
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "## SymlinkEscape PoC Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" | grep -q "EXPLOIT CONFIRMED" && echo "✅ EXPLOIT CONFIRMED found in output" || echo "⚠️  EXPLOIT CONFIRMED not found"
