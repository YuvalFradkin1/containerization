name: SymlinkEscape PoC — SIG-NEW (CWE-61/CWE-22)

on:
  push:
    branches: [main]
    paths:
      - 'poc-real/**'
      - '.github/workflows/poc-symlink-escape.yml'
  workflow_dispatch:

jobs:
  poc:
    name: Run SymlinkEscapePoC on macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: poc-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info (for evidence)
        run: |
          echo "## Runner Info" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner OS: $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner Arch: $RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: $GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          sw_vers
          uname -m

      - name: Swift version
        run: swift --version

      - name: Install and link all required C libraries
        run: |
          brew install libarchive xz bzip2 zstd
          # Force-link keg-only formulae so dylibs appear in /opt/homebrew/lib
          brew link --force libarchive bzip2 || true
          # xz and zstd are usually already linked
          echo "=== /opt/homebrew/lib: archive, lzma, bz2, zstd ==="
          ls /opt/homebrew/lib/ | grep -E "archive|lzma|bz2|zstd" || echo "(nothing)"
          echo "=== brew prefix libarchive ===" && brew --prefix libarchive
          echo "=== brew prefix zstd ===" && brew --prefix zstd

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build SymlinkEscapePoC
        run: |
          LIBARCHIVE_PREFIX=$(brew --prefix libarchive)
          ZSTD_PREFIX=$(brew --prefix zstd)
          # Build in debug mode to avoid -c release overriding -Onone swiftSettings.
          # The _StrSlice.== symbol from swift-system is @_alwaysEmitIntoClient;
          # it must be emitted into every client object file. With -c release the
          # Swift 6 compiler on arm64 generates a spurious external reference instead.
          # Debug mode reliably triggers the correct @_alwaysEmitIntoClient emission.
          swift build --product SymlinkEscapePoC \
            -Xcc -I${LIBARCHIVE_PREFIX}/include \
            -Xcc -I${ZSTD_PREFIX}/include \
            -Xlinker -L${LIBARCHIVE_PREFIX}/lib \
            -Xlinker -L$(brew --prefix xz)/lib \
            -Xlinker -L$(brew --prefix bzip2)/lib \
            -Xlinker -L${ZSTD_PREFIX}/lib \
            -Xlinker -L/opt/homebrew/lib \
            2>&1 | tee /tmp/build.log
          # Fail the step if build failed
          echo "## Build log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -200 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run SymlinkEscapePoC — verify all stages pass
        run: |
          set +e
          OUTPUT=$(.build/debug/SymlinkEscapePoC 2>&1)
          POC_EXIT=$?
          echo "$OUTPUT"

          echo "## PoC Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Verify each stage printed its success marker.
          # The workflow fails hard if any stage is missing from output.
          FAIL=0
          for MARKER in \
            "Stage 1 PASS" \
            "Stage 2 PASS" \
            "Stage 3 PASS" \
            "Stage 4 PASS"; do
            if echo "$OUTPUT" | grep -qF "$MARKER"; then
              echo "::notice::$MARKER found"
            else
              echo "::error::MISSING: $MARKER"
              FAIL=1
            fi
          done

          echo "## Stage verification" >> "$GITHUB_STEP_SUMMARY"
          for MARKER in "Stage 1 PASS" "Stage 2 PASS" "Stage 3 PASS" "Stage 4 PASS"; do
            if echo "$OUTPUT" | grep -qF "$MARKER"; then
              echo "- ✅ $MARKER" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ MISSING: $MARKER" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ $POC_EXIT -ne 0 ]; then
            echo "::error::PoC binary exited with code $POC_EXIT"
            FAIL=1
          fi

          exit $FAIL

      - name: Artifact — raw PoC output
        if: always()
        run: |
          .build/debug/SymlinkEscapePoC > /tmp/poc-output.txt 2>&1 || true
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-output-${{ github.run_number }}
          path: /tmp/poc-output.txt
          retention-days: 90
