name: PoC – xattr asciiValue! crash

on:
  push:
    branches: [poc-crash-test]
    paths-ignore:
      - 'crash-evidence/**'
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift environment info
        run: |
          mkdir -p crash-evidence
          swift --version 2>&1 | tee crash-evidence/swift-version.txt
          xcode-select --print-path >> crash-evidence/swift-version.txt

      - name: Run minimal PoC reproducer
        id: poc_minimal
        run: |
          echo "=== Compiling minimal PoC ===" | tee crash-evidence/poc-minimal.txt
          swiftc -O poc/poc_reproduce.swift -o /tmp/poc_reproduce 2>&1 | tee -a crash-evidence/poc-minimal.txt
          echo "=== Running — expect Fatal error ===" | tee -a crash-evidence/poc-minimal.txt
          set +e
          /tmp/poc_reproduce 2>&1 | tee -a crash-evidence/poc-minimal.txt
          EXITCODE=$?
          echo "EXIT_CODE=$EXITCODE" | tee -a crash-evidence/poc-minimal.txt
        continue-on-error: true

      - name: Collect crash reports (minimal PoC)
        if: always()
        run: |
          sleep 5
          echo "=== DiagnosticReports listing ===" | tee crash-evidence/crash-reports.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/poc_reproduce*.ips ~/Library/Logs/DiagnosticReports/poc_reproduce*.crash 2>/dev/null | head -5); do
            echo "=== CRASH REPORT: $f ===" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/ 2>/dev/null || true
          done

      - name: Try full cctl build
        id: build_cctl
        run: |
          for xc in /Applications/Xcode_26*.app /Applications/Xcode_16.4*.app /Applications/Xcode_16.3*.app /Applications/Xcode_16.2*.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null && break
            fi
          done
          swift --version 2>&1 | tee crash-evidence/cctl-build.txt
          swift build -c release --product cctl 2>&1 | tee -a crash-evidence/cctl-build.txt
        continue-on-error: true

      - name: Generate + load malicious OCI image
        if: steps.build_cctl.outcome == 'success'
        run: |
          python3 poc/craft_layer.py 2>&1 | tee crash-evidence/cctl-poc.txt
          .build/release/cctl images load -i malicious.tar 2>&1 | tee -a crash-evidence/cctl-poc.txt
        continue-on-error: true

      - name: Unpack image — expect cctl crash
        if: steps.build_cctl.outcome == 'success'
        run: |
          mkdir -p /tmp/crash-test
          set +e
          .build/release/cctl images pull --unpack-path /tmp/crash-test malicious:latest 2>&1 | tee -a crash-evidence/cctl-poc.txt
          echo "CCTL_EXIT=$?" | tee -a crash-evidence/cctl-poc.txt
        continue-on-error: true

      - name: Collect crash reports (cctl)
        if: always()
        run: |
          sleep 5
          echo "=== cctl DiagnosticReports ===" | tee -a crash-evidence/crash-reports.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i cctl | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/cctl*.ips ~/Library/Logs/DiagnosticReports/cctl*.crash 2>/dev/null | head -3); do
            echo "=== CCTL CRASH REPORT: $f ===" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/ 2>/dev/null || true
          done

      - name: Commit crash evidence to branch
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YuvalFradkin1/containerization.git
          git add crash-evidence/
          git diff --cached --stat
          git commit -m "ci: add crash evidence [skip ci]" || echo "Nothing to commit"
          git push origin poc-crash-test || echo "Push failed"
