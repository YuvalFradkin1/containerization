name: PoC – xattr asciiValue! crash

on:
  push:
    branches: [poc-crash-test]
    paths-ignore:
      - 'crash-evidence/**'
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift environment info
        run: |
          mkdir -p crash-evidence
          swift --version 2>&1 | tee crash-evidence/swift-version.txt
          xcode-select --print-path >> crash-evidence/swift-version.txt

      - name: Run minimal PoC reproducer (verbatim EXT4+Xattrs.swift excerpt)
        id: poc_minimal
        run: |
          echo "=== Compiling poc_reproduce.swift ===" | tee crash-evidence/poc-minimal.txt
          swiftc poc/poc_reproduce.swift -o /tmp/poc_reproduce 2>&1 | tee -a crash-evidence/poc-minimal.txt
          echo "Compile exit: $?" | tee -a crash-evidence/poc-minimal.txt

          echo "" | tee -a crash-evidence/poc-minimal.txt
          echo "=== Running — expect Fatal error: Unexpectedly found nil ===" | tee -a crash-evidence/poc-minimal.txt
          # Run without pipe to preserve signal exit and capture true stderr
          /tmp/poc_reproduce > /tmp/poc_out.txt 2>&1
          EXITCODE=$?
          cat /tmp/poc_out.txt | tee -a crash-evidence/poc-minimal.txt
          echo "" | tee -a crash-evidence/poc-minimal.txt
          echo "Process exit code: $EXITCODE (134=SIGABRT/crash, 0=clean exit)" | tee -a crash-evidence/poc-minimal.txt
        continue-on-error: true

      - name: Wait and collect all crash reports
        if: always()
        run: |
          echo "Waiting 10s for crash reports to be written..." | tee crash-evidence/crash-reports.txt
          sleep 10
          echo "" | tee -a crash-evidence/crash-reports.txt
          echo "=== ~/Library/Logs/DiagnosticReports/ ===" | tee -a crash-evidence/crash-reports.txt
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tee -a crash-evidence/crash-reports.txt
          echo "" | tee -a crash-evidence/crash-reports.txt

          echo "=== poc_reproduce crash reports ===" | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/poc_reproduce*.ips ~/Library/Logs/DiagnosticReports/poc_reproduce*.crash 2>/dev/null | head -5); do
            echo "--- $f ---" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/
          done

          echo "=== cctl crash reports ===" | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/cctl*.ips ~/Library/Logs/DiagnosticReports/cctl*.crash 2>/dev/null | head -3); do
            echo "--- $f ---" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/
          done

      - name: Commit crash evidence to branch
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YuvalFradkin1/containerization.git
          git pull --rebase origin poc-crash-test 2>/dev/null || true
          git add crash-evidence/
          git diff --cached --stat
          git commit -m "ci: gate-a crash evidence $(date -u +%Y%m%dT%H%M%SZ) [skip ci]" || echo "Nothing to commit"
          git push origin poc-crash-test || echo "Push failed"
