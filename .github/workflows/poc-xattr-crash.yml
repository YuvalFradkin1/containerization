name: PoC – xattr asciiValue! crash

on:
  push:
    branches: [poc-crash-test]
    paths-ignore:
      - 'crash-evidence/**'
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift environment info
        run: |
          mkdir -p crash-evidence
          swift --version 2>&1 | tee crash-evidence/swift-version.txt
          xcode-select --print-path >> crash-evidence/swift-version.txt

      - name: Run minimal PoC reproducer (debug build, no -O)
        id: poc_minimal
        run: |
          echo "=== Compiling minimal PoC (debug, no optimization) ===" | tee crash-evidence/poc-minimal.txt
          # Compile WITHOUT -O so force-unwrap trap is never optimized
          swiftc poc/poc_reproduce.swift -o /tmp/poc_reproduce 2>&1 | tee -a crash-evidence/poc-minimal.txt

          echo "=== Running PoC — expect Fatal error on U+00E9 ===" | tee -a crash-evidence/poc-minimal.txt
          # Run WITHOUT pipe to capture true exit code
          /tmp/poc_reproduce > /tmp/poc_out.txt 2>&1 || true
          EXITCODE=$?
          cat /tmp/poc_out.txt | tee -a crash-evidence/poc-minimal.txt
          echo "REAL_EXIT_CODE=$EXITCODE" | tee -a crash-evidence/poc-minimal.txt
          echo "Expected exit code: 134 (SIGABRT) if crash occurred"
        continue-on-error: true

      - name: Collect crash reports (minimal PoC)
        if: always()
        run: |
          sleep 5
          echo "=== DiagnosticReports listing ===" | tee crash-evidence/crash-reports.txt
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20 | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/poc_reproduce*.ips ~/Library/Logs/DiagnosticReports/poc_reproduce*.crash 2>/dev/null | head -5); do
            echo "=== CRASH REPORT: $f ===" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/ 2>/dev/null || true
          done

      - name: Full cctl pipeline (Swift 6.1.2 build succeeded)
        id: build_cctl
        run: |
          swift build -c release --product cctl 2>&1 | tail -5 | tee crash-evidence/cctl-build.txt
        continue-on-error: true

      - name: Generate malicious OCI image
        if: steps.build_cctl.outcome == 'success'
        run: |
          python3 poc/craft_layer.py 2>&1 | tee crash-evidence/cctl-poc.txt

      - name: Load image into cctl store
        if: steps.build_cctl.outcome == 'success'
        run: |
          .build/release/cctl images load -i malicious.tar 2>&1 | tee -a crash-evidence/cctl-poc.txt
        continue-on-error: true

      - name: Verify image is in store
        if: steps.build_cctl.outcome == 'success'
        run: |
          echo "=== cctl images list ===" | tee -a crash-evidence/cctl-poc.txt
          .build/release/cctl images 2>&1 | tee -a crash-evidence/cctl-poc.txt
          echo "=== cctl help ===" | tee -a crash-evidence/cctl-poc.txt
          .build/release/cctl --help 2>&1 | tee -a crash-evidence/cctl-poc.txt
          .build/release/cctl rootfs --help 2>&1 | tee -a crash-evidence/cctl-poc.txt || true

      - name: Unpack via cctl rootfs (trigger xattr processing)
        if: steps.build_cctl.outcome == 'success'
        run: |
          mkdir -p /tmp/crash-test
          echo "=== Attempting rootfs unpack ===" | tee -a crash-evidence/cctl-poc.txt
          set +e
          # Try multiple possible command forms for unpacking a loaded image
          .build/release/cctl rootfs create --image malicious:latest /tmp/crash-test 2>&1 | tee -a crash-evidence/cctl-poc.txt
          echo "rootfs-create exit=$?" >> crash-evidence/cctl-poc.txt
          .build/release/cctl images pull malicious:latest --unpack-path /tmp/crash-test2 2>&1 | tee -a crash-evidence/cctl-poc.txt || true
          echo "images-pull exit=$?" >> crash-evidence/cctl-poc.txt
        continue-on-error: true

      - name: Collect crash reports (cctl)
        if: always()
        run: |
          sleep 5
          echo "=== cctl DiagnosticReports ===" | tee -a crash-evidence/crash-reports.txt
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i cctl | head -5 | tee -a crash-evidence/crash-reports.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/cctl*.ips ~/Library/Logs/DiagnosticReports/cctl*.crash 2>/dev/null | head -3); do
            echo "=== CCTL CRASH REPORT: $f ===" | tee -a crash-evidence/crash-reports.txt
            cat "$f" | tee -a crash-evidence/crash-reports.txt
            cp "$f" crash-evidence/ 2>/dev/null || true
          done

      - name: Commit crash evidence to branch
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/YuvalFradkin1/containerization.git
          git pull --rebase origin poc-crash-test 2>/dev/null || true
          git add crash-evidence/
          git diff --cached --stat
          git commit -m "ci: crash evidence run $(date -u +%Y%m%dT%H%M%SZ) [skip ci]" || echo "Nothing to commit"
          git push origin poc-crash-test || echo "Push failed"
