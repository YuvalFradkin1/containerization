name: PoC – xattr asciiValue! crash

on:
  push:
    branches: [poc-crash-test]
  workflow_dispatch:

jobs:
  crash-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift environment info
        run: |
          swift --version | tee /tmp/evidence.txt
          echo "---" >> /tmp/evidence.txt
          xcode-select --print-path >> /tmp/evidence.txt

      - name: Run minimal PoC reproducer (no full build needed)
        id: poc_minimal
        run: |
          echo "=== Compiling minimal PoC ===" | tee -a /tmp/evidence.txt
          swiftc -O poc/poc_reproduce.swift -o /tmp/poc_reproduce 2>&1 | tee -a /tmp/evidence.txt
          echo "=== Running — expect Fatal error ===" | tee -a /tmp/evidence.txt
          set +e
          /tmp/poc_reproduce 2>&1 | tee -a /tmp/evidence.txt
          EXITCODE=$?
          echo "EXIT_CODE=$EXITCODE" | tee -a /tmp/evidence.txt
        continue-on-error: true

      - name: Collect crash evidence (minimal PoC)
        if: always()
        run: |
          sleep 4
          echo "=== DiagnosticReports ===" | tee -a /tmp/evidence.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tee -a /tmp/evidence.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/poc_reproduce*.ips ~/Library/Logs/DiagnosticReports/poc_reproduce*.crash 2>/dev/null | head -3); do
            echo "--- CRASH REPORT: $f ---" | tee -a /tmp/evidence.txt
            cat "$f" | tee -a /tmp/evidence.txt
          done
          mkdir -p /tmp/crash-artifacts
          cp /tmp/evidence.txt /tmp/crash-artifacts/poc-evidence.txt
          cp ~/Library/Logs/DiagnosticReports/poc_reproduce*.ips /tmp/crash-artifacts/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/poc_reproduce*.crash /tmp/crash-artifacts/ 2>/dev/null || true

      - name: Try full cctl build (Swift 6.3 required)
        id: build_cctl
        run: |
          for xc in /Applications/Xcode_26*.app /Applications/Xcode_16.4*.app /Applications/Xcode_16.3*.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc/Contents/Developer" && break
            fi
          done
          swift build -c release --product cctl 2>&1 | tee -a /tmp/crash-artifacts/build.txt
        continue-on-error: true

      - name: Generate malicious OCI image
        if: steps.build_cctl.outcome == 'success'
        run: python3 poc/craft_layer.py | tee -a /tmp/crash-artifacts/poc-evidence.txt

      - name: Load image
        if: steps.build_cctl.outcome == 'success'
        run: .build/release/cctl images load -i malicious.tar 2>&1 | tee -a /tmp/crash-artifacts/poc-evidence.txt
        continue-on-error: true

      - name: Unpack image — expect cctl crash
        if: steps.build_cctl.outcome == 'success'
        id: unpack
        run: |
          mkdir -p /tmp/crash-test
          set +e
          .build/release/cctl images pull --unpack-path /tmp/crash-test malicious:latest 2>&1 | tee -a /tmp/crash-artifacts/poc-evidence.txt
          echo "CCTL_EXIT=$?" | tee -a /tmp/crash-artifacts/poc-evidence.txt
        continue-on-error: true

      - name: Collect crash evidence (cctl)
        if: always()
        run: |
          sleep 4
          echo "=== cctl DiagnosticReports ===" | tee -a /tmp/crash-artifacts/poc-evidence.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tee -a /tmp/crash-artifacts/poc-evidence.txt
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/cctl*.ips ~/Library/Logs/DiagnosticReports/cctl*.crash 2>/dev/null | head -3); do
            echo "--- CRASH REPORT: $f ---" | tee -a /tmp/crash-artifacts/poc-evidence.txt
            cat "$f" | tee -a /tmp/crash-artifacts/poc-evidence.txt
            cp "$f" /tmp/crash-artifacts/ 2>/dev/null || true
          done

      - name: Upload crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-evidence
          path: /tmp/crash-artifacts/
          if-no-files-found: warn
